name: Android Auto APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Automatically Generate Official Gradle Wrapper
      run: |
        npm install -g gradle
        gradle wrapper
        chmod +x gradlew

    - name: Build APK (Bypass KSP Eror & Keystore)
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.welcome-provider.enabled=false -Dksp.incremental=false -Pandroid.injected.signing.config.file=""
