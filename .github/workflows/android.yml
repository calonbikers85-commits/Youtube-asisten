name: Android Auto APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Automatically Generate Official Gradle Wrapper
      run: |
        npm install -g gradle
        gradle wrapper
        chmod +x gradlew

    - name: Clean and Build APK (Debug)
      run: ./gradlew clean assembleDebug --no-daemon -Pandroid.injected.signing.config.file=""

