name: Android Auto APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Automatically Generate Official Gradle Wrapper
      run: |
        npm install -g gradle
        gradle wrapper
        chmod +x gradlew

    - name: Generate Dummy Debug Keystore
      run: |
        mkdir -p app
        keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build APK (Bypass Signing Verification)
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.welcome-provider.enabled=false -Dksp.incremental=false
